[project]
name = "pitch-ledger"
version = "0.1.0"
description = "Audited, personalized match intelligence from synthetic football events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "agent-framework-core>=1.21,<2",
    "agent-framework-foundry>=1.14,<2",
    "azure-identity>=1.25",
    "mcp>=1.24,<2",
    "azure-eventhub>=5.15.1",
    "websocket-client>=1.9.2",
    "azure-kusto-data>=6.0.4",
    "azure-kusto-ingest>=6.0.4",
    "azure-cosmos>=4.17.1",
    "azure-servicebus>=7.15.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "azure-messaging-webpubsubservice>=1.3.0",
    "azure-monitor-opentelemetry>=1.8.10,<2",
    "opentelemetry-api>=1.45",
]

[project.scripts]
pitch-ledger = "pitch_ledger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitch_ledger"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/pitch_ledger"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
